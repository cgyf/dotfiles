[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 1018.0
    output = "eDP-1"
    placement_height = 1200.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
telemetry_enabled = true

[theme]
builtin = "Noctalia"
community_palette = "Oxocarbon"
mode = "auto"
source = "builtin"
wallpaper_scheme = "m3-content"
[wallpaper]
# 壁纸目录
directory = "~/.dotfiles/wallpaper" 
[wallpaper.default]
path = "~/.dotfiles/wallpaper/wallhaven-e8r7wk_1920x1200.png"

[wallpaper.last]
path = "~/.dotfiles/wallpaper/wallhaven-e8r7wk_1920x1200.png"

[wallpaper.monitors.eDP-1]
path = "~/.dotfiles/wallpaper/wallhaven-e8r7wk_1920x1200.png"
